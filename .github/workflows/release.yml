name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: Audit dependencies
        run: uv run pip-audit --local --progress-spinner off

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Run tests
        run: uv run pytest --cov=anihmm --cov-report=term-missing --cov-fail-under=85

      - name: Check documentation GIFs
        run: uv run python -m tools.generate_demo_gif --check

      - name: Lint Markdown
        run: uv run rumdl check README.md docs

      - name: Build docs
        run: uv run zensical build --clean --strict

      - name: Build package
        run: uv build --out-dir "$RUNNER_TEMP/anihmm-release-dist"

      - name: Test installed wheel
        shell: bash
        run: |
          wheel_check="$(mktemp -d "$RUNNER_TEMP/anihmm-wheel-check.XXXXXX")"
          cp -R tests examples "$wheel_check/"
          cd "$wheel_check"
          uv run --no-project --isolated \
            --with "$RUNNER_TEMP"/anihmm-release-dist/anihmm-*.whl \
            --with pytest python -I -m pytest tests

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anihmm-dist
          path: ${{ runner.temp }}/anihmm-release-dist/anihmm-*
          if-no-files-found: error

      - name: Upload docs artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anihmm-site
          path: site

  create-github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: anihmm-dist
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/anihmm-* --generate-notes --verify-tag

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/anihmm
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: anihmm-dist
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
