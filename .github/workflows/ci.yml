name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Run tests
        run: uv run --no-sync pytest --cov=anihmm --cov-report=term-missing --cov-fail-under=85

      - name: Build package
        shell: bash
        run: uv build --out-dir "$RUNNER_TEMP/anihmm-dist"

      - name: Test installed wheel
        shell: bash
        run: |
          wheel_check="$(mktemp -d "$RUNNER_TEMP/anihmm-wheel-check.XXXXXX")"
          cp -R tests examples "$wheel_check/"
          cd "$wheel_check"
          uv run --no-project --isolated \
            --with "$RUNNER_TEMP"/anihmm-dist/anihmm-*.whl \
            --with pytest python -I -m pytest tests

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: Audit dependencies
        run: uv run pip-audit --local --progress-spinner off

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Check documentation GIFs
        run: uv run python -m tools.generate_demo_gif --check

      - name: Lint Markdown
        run: uv run rumdl check README.md docs

      - name: Build docs
        run: uv run zensical build --clean --strict

      - name: Build package
        run: uv build --out-dir "$RUNNER_TEMP/anihmm-dist"
