[project]
site_name = "anihmm"
site_url = "https://leightonpayne.github.io/anihmm"
site_description = "Small HMM-style animations for terminal applications."
repo_name = "leightonpayne/anihmm"
repo_url = "https://github.com/leightonpayne/anihmm"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Leighton Payne"
extra_css = ["stylesheets/extra.css"]
nav = [
  { Home = [
    { Overview = "index.md" },
    { Installation = "about/installation.md" },
    { License = "about/license.md" },
    { Contributing = "about/contributing.md" }
  ] },
  { Usage = [
    { Quickstart = "usage/quickstart.md" },
    { Examples = "usage/example.md" },
    { "Python API" = "usage/inputs.md" },
    { "Custom Sequences" = "usage/sequences.md" }
  ] },
  { Developer = [
    { "Codebase Tour" = "developer/codebase.md" },
    { "Rendering Pipeline" = "developer/rendering.md" },
    { "Testing and Release" = "developer/testing.md" }
  ] },
  { "API Reference" = [
    { Overview = "reference/index.md" },
    { "Application API" = "reference/api.md" },
    { "Sequence API" = "reference/sequence.md" },
    { "Playback API" = "reference/playback.md" },
    { "Rendering and Presets" = "reference/animation.md" },
    { Exceptions = "reference/exceptions.md" }
  ] },
]

[project.theme]
name = "flexoki"
variant = "modern"
features = [
  "content.code.copy",
  "content.code.annotate",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.path",
]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/leightonpayne/anihmm"

[[project.extra.social]]
icon = "fontawesome/brands/bluesky"
link = "https://bsky.app/profile/leightonpayne.bsky.social"

[[project.extra.social]]
icon = "fontawesome/brands/x-twitter"
link = "https://x.com/leightonpayne"

[project.plugins.search]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
inherited_members = true
show_source = false
separate_signature = true
show_signature_annotations = true
show_root_heading = true
show_symbol_type_heading = true
show_symbol_type_toc = true
heading_level = 2
show_object_full_path = false
show_category_heading = false

[project.markdown_extensions.admonition]

[project.markdown_extensions.abbr]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.def_list]

[project.markdown_extensions.footnotes]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.betterem]

[project.markdown_extensions.pymdownx.caret]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.keys]

[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.magiclink]

[project.markdown_extensions.pymdownx.mark]

[project.markdown_extensions.pymdownx.smartsymbols]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.tilde]
